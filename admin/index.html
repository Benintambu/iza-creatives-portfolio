<body>

    <section class="login-container">
        <div class="login-left">
            <img src="/assets/images/logo/logo1.png" alt="Logo IZA Creatives" class="login-logo">

            <h1>Espace Admin</h1>
            <p>Entrez vos identifiants pour vous connecter</p>

            <form id="loginForm">
                <div class="input-container">
                    <input type="email" id="email" placeholder="Email" required autofocus>
                    <i class="bx bx-envelope main-icon"></i>
                </div>

                <div class="input-container">
                    <input type="password" id="password" placeholder="Mot de passe" required>
                    <i class="bx bx-lock-keyhole main-icon"></i>
                    <i class="bx bx-eye-slash password-toggle" role="button" tabindex="0"
                        aria-label="Afficher ou masquer le mot de passe"></i>
                </div>

                <button type="submit">
                    Se connecter
                </button>
                <a href="/admin/forgot-password" class="forgot-pass">Mot de passe oublié ?</a>
            </form>
        </div>

        <div class="login-right"></div>
    </section>


    <script type="module" src="/admin/js/login.js"></script>
</body>

</html>
