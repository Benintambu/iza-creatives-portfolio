    <section class="login-container">
        <div class="login-left">
            <img src="/assets/images/logo/logo1.png" alt="Logo IZA Creatives" class="login-logo">

            <h1>Réinitialiser le mot de passe</h1>
            <p>Entrez votre email pour recevoir le lien de réinitialisation</p>

            <form id="resetRequestForm">
                <div class="input-container">
                    <input type="email" id="email" placeholder="Votre email" required>
                    <i class="bx bx-envelope main-icon"></i>
                </div>

                <button type="submit">
                    Envoyer le lien
                </button>
            </form>
        </div>

        <div class="login-right login-forgot-password"></div>
    </section>

    <script type="module" src="forgot-password.js"></script>
