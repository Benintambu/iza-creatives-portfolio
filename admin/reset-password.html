<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iza Creatives - Admin | Réinitialiser le mot de passe</title>
    <link rel="stylesheet" href="/admin/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Basic Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <!-- Filled Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <!-- Brand Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
</head>

<body>
    <section class="login-container">
        <div class="login-left">
            <img src="/assets/images/logo/logo1.png" alt="Logo IZA Creatives" class="login-logo">

            <h1>Nouveau mot de passe</h1>
            <p>Saissisez un nouveau mot de passe</p>

            <form id="newPasswordForm">

                <div class="input-container">
                    <input type="password" id="password" placeholder="Nouveau mot de passe" required>
                    <i class="bx bx-lock-keyhole main-icon"></i>
                    <i class="fas fa-eye-slash password-toggle" role="button" tabindex="0"
                        aria-label="Afficher ou masquer le mot de passe"></i>
                </div>

                <button type="submit">
                    Modifier
                </button>
            </form>
        </div>

        <div class="login-right login-reset-password"></div>
    </section>

    <script type="module" src="/admin/js/reset-password.js"></script>
</body>

</html>
